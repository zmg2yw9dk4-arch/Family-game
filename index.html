<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#08111c"><title>Familie Quest</title><style>html,body{height:100%;margin:0;background:#08111c;color:#fff;font-family:system-ui;display:grid;place-items:center}.box{text-align:center;padding:24px}.spin{width:42px;height:42px;border:4px solid #ffffff2a;border-top-color:#68f5b1;border-radius:50%;margin:0 auto 14px;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}</style></head><body><div class="box"><div class="spin"></div><strong>Familie Quest laden…</strong></div><script>(async()=>{try{const files=['chunks/part01.txt','chunks/part02.txt','chunks/part03.txt','chunks/part04.txt','chunks/part05.txt','chunks/part06.txt','chunks/part07.txt','chunks/part08.txt','chunks/part09.txt','chunks/part10.txt'];const parts=await Promise.all(files.map(f=>fetch(f,{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error(f);return r.text()})));document.open();document.write(parts.join(''));document.close()}catch(e){document.body.innerHTML='<div class="box"><h2>Laden mislukt</h2><p>Ververs de pagina of probeer het opnieuw.</p></div>'}})();</script></body></html>
